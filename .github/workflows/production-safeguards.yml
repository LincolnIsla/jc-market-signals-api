name: Validate staged production safeguards
on:
  push:
    branches:
      - main
      - feature/live-trading-guardrails-20261028
      - feature/cash-only-preflight-20261028
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax without connecting to E*TRADE
        run: python -m compileall -q app.py production_checks.py production_readonly.py live_cash_preflight.py tests
      - name: Verify connection-page JavaScript syntax
        run: node --check production_ui.js
      - name: Offline safeguard and read-only API tests
        run: python -m unittest discover -s tests -p 'test_production*.py' -v
      - name: Cash-only fail-closed validator tests
        run: python -m unittest discover -s tests -p 'test_live_cash_preflight.py' -v
